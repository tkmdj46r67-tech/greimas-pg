<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Greimas Square</title>
<style>
  /* ---------- Theme tokens (adapts to Obsidian, falls back to light/dark) ---------- */
  :root {
    --gs-bg:        var(--background-primary, #ffffff);
    --gs-panel:     var(--background-secondary, #f4f5f7);
    --gs-text:      var(--text-normal, #1f2328);
    --gs-muted:     var(--text-muted, #6b7280);
    --gs-border:    var(--background-modifier-border, #dcdfe4);
    --gs-accent:    var(--interactive-accent, #6c5ce7);
    --gs-accent-fg: var(--text-on-accent, #ffffff);
    --gs-line:      var(--text-faint, #9aa3b2);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --gs-bg:     var(--background-primary, #1e1e22);
      --gs-panel:  var(--background-secondary, #26262c);
      --gs-text:   var(--text-normal, #e7e7ea);
      --gs-muted:  var(--text-muted, #9aa0aa);
      --gs-border: var(--background-modifier-border, #3b3b44);
      --gs-accent: var(--interactive-accent, #8b7bff);
      --gs-line:   var(--text-faint, #79808f);
    }
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--gs-bg);
    color: var(--gs-text);
    font-family: var(--font-interface, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, "Helvetica Neue", Arial, sans-serif);
    font-size: 15px;
    line-height: 1.45;
    padding: 22px 16px 34px;
    display: flex;
    justify-content: center;
    -webkit-text-size-adjust: 100%;
  }

  .gs-app { width: 100%; max-width: 640px; }

  /* ---------- Header ---------- */
  .gs-app header { text-align: center; margin: 0 0 18px; }
  .gs-app header h1 {
    margin: 0 0 4px;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .gs-app header p {
    margin: 0;
    font-size: .8rem;
    color: var(--gs-muted);
  }

  /* ---------- The square ---------- */
  .gs-square {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--gs-bg);
    margin: 0 auto;
  }

  .gs-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .gs-lines line {
    stroke: var(--gs-line);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
    stroke-linecap: round;
  }
  .gs-lines line.gs-diag {
    stroke-dasharray: 6 6;
    opacity: .7;
  }

  /* ---------- Terms (corners) ---------- */
  .gs-term {
    position: absolute;
    transform: translate(-50%, -50%);
    max-width: 32%;
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--gs-bg);
    text-align: center;
    line-height: 1.2;
    overflow-wrap: anywhere;
    word-break: break-word;
    z-index: 2;
  }
  .gs-term-main {
    font-size: 1rem;
    font-weight: 600;
    color: var(--gs-text);
    min-height: 1.2em;
  }
  .gs-term-main.is-empty { color: var(--gs-muted); font-weight: 400; }
  .gs-term-label {
    margin-top: 3px;
    font-size: .62rem;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--gs-muted);
  }

  .gs-tl { left: 18%; top: 18%; }
  .gs-tr { left: 82%; top: 18%; }
  .gs-bl { left: 18%; top: 82%; }
  .gs-br { left: 82%; top: 82%; }

  /* ---------- Relations (edges) ---------- */
  .gs-rel {
    position: absolute;
    transform: translate(-50%, -50%);
    max-width: 28%;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--gs-bg);
    text-align: center;
    line-height: 1.15;
    overflow-wrap: anywhere;
    word-break: break-word;
    pointer-events: none;
    z-index: 1;
  }
  .gs-rel-main {
    font-size: .72rem;
    font-weight: 600;
    color: var(--gs-text);
    min-height: 1.15em;
  }
  .gs-rel-main.is-empty { color: var(--gs-muted); font-weight: 400; }
  .gs-rel-label {
    margin-top: 2px;
    font-size: .55rem;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--gs-muted);
  }

  .gs-rel-top    { left: 50%; top: 18%; }
  .gs-rel-bottom { left: 50%; top: 82%; }
  .gs-rel-left   { left: 18%; top: 50%; }
  .gs-rel-right  { left: 82%; top: 50%; }

  /* ---------- Pulse animation on update ---------- */
  @keyframes gs-pulse {
    from { transform: translate(-50%, -50%) scale(.92); opacity: .35; }
    to   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
  }
  .gs-term.gs-pulse,
  .gs-rel.gs-pulse { animation: gs-pulse .28s ease-out; }

  /* ---------- Form sections ---------- */
  .gs-section { margin-top: 22px; }
  .gs-section-title {
    margin: 0 0 10px;
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: var(--gs-muted);
  }

  .gs-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 14px;
  }
  .gs-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .gs-field label {
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--gs-muted);
  }
  .gs-field label .gs-tag {
    font-weight: 700;
    color: var(--gs-text);
    margin-right: 4px;
  }
  .gs-field input {
    width: 100%;
    padding: 8px 10px;
    font: inherit;
    font-size: .9rem;
    color: var(--gs-text);
    background: var(--gs-panel);
    border: 1px solid var(--gs-border);
    border-radius: 8px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .gs-field input::placeholder { color: var(--gs-muted); opacity: .7; }
  .gs-field input:focus {
    border-color: var(--gs-accent);
    box-shadow: 0 0 0 3px rgba(124, 108, 231, .18);
  }

  /* ---------- Buttons ---------- */
  .gs-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 22px;
  }
  .gs-actions button {
    font: inherit;
    font-size: .88rem;
    font-weight: 600;
    padding: 9px 22px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--gs-accent);
    color: var(--gs-accent-fg);
    cursor: pointer;
    transition: filter .15s ease, transform .06s ease;
  }
  .gs-actions button:hover { filter: brightness(1.08); }
  .gs-actions button:active { transform: translateY(1px); }
  .gs-actions button.gs-secondary {
    background: transparent;
    color: var(--gs-muted);
    border-color: var(--gs-border);
  }
  .gs-actions button.gs-secondary:hover {
    filter: none;
    color: var(--gs-text);
    border-color: var(--gs-muted);
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 520px) {
    .gs-controls { grid-template-columns: 1fr; }
    .gs-term { font-size: .95rem; max-width: 34%; padding: 5px 8px; }
    .gs-term-main { font-size: .9rem; }
    .gs-rel { max-width: 32%; }
  }
</style>
</head>
<body>

<div class="gs-app">
  <header>
    <h1>Greimas Square</h1>
    <p>Edit the four terms and four relations, then press <strong>Update square</strong>.</p>
  </header>

  <!-- ===== The square ===== -->
  <div class="gs-square">
    <svg class="gs-lines" viewBox="0 0 100 100" preserveAspectRatio="none"
         aria-hidden="true" focusable="false">
      <!-- outer square -->
      <line x1="18" y1="18" x2="82" y2="18"></line>
      <line x1="82" y1="18" x2="82" y2="82"></line>
      <line x1="18" y1="18" x2="18" y2="82"></line>
      <line x1="18" y1="82" x2="82" y2="82"></line>
      <!-- diagonals -->
      <line class="gs-diag" x1="18" y1="18" x2="82" y2="82"></line>
      <line class="gs-diag" x1="82" y1="18" x2="18" y2="82"></line>
    </svg>

    <!-- Terms -->
    <div class="gs-term gs-tl" id="term-1">
      <div class="gs-term-main" id="term-1-main">Life</div>
      <div class="gs-term-label">S₁</div>
    </div>
    <div class="gs-term gs-tr" id="term-2">
      <div class="gs-term-main" id="term-2-main">Death</div>
      <div class="gs-term-label">S₂</div>
    </div>
    <div class="gs-term gs-bl" id="term-3">
      <div class="gs-term-main" id="term-3-main">Non-life</div>
      <div class="gs-term-label">~S₁</div>
    </div>
    <div class="gs-term gs-br" id="term-4">
      <div class="gs-term-main" id="term-4-main">Non-death</div>
      <div class="gs-term-label">~S₂</div>
    </div>

    <!-- Relations -->
    <div class="gs-rel gs-rel-top" id="rel-1">
      <div class="gs-rel-main" id="rel-1-main">Contrary</div>
      <div class="gs-rel-label">Contrary</div>
    </div>
    <div class="gs-rel gs-rel-bottom" id="rel-2">
      <div class="gs-rel-main" id="rel-2-main">Subcontrary</div>
      <div class="gs-rel-label">Subcontrary</div>
    </div>
    <div class="gs-rel gs-rel-left" id="rel-3">
      <div class="gs-rel-main" id="rel-3-main">Contradiction</div>
      <div class="gs-rel-label">Contradiction</div>
    </div>
    <div class="gs-rel gs-rel-right" id="rel-4">
      <div class="gs-rel-main" id="rel-4-main">Contradiction</div>
      <div class="gs-rel-label">Contradiction</div>
    </div>
  </div>

  <!-- ===== Editor: Terms ===== -->
  <div class="gs-section">
    <h2 class="gs-section-title">Terms</h2>
    <div class="gs-controls">
      <div class="gs-field">
        <label for="in-1"><span class="gs-tag">S₁</span> top left</label>
        <input id="in-1" type="text" value="Life" autocomplete="off" spellcheck="false" />
      </div>
      <div class="gs-field">
        <label for="in-2"><span class="gs-tag">S₂</span> top right</label>
        <input id="in-2" type="text" value="Death" autocomplete="off" spellcheck="false" />
      </div>
      <div class="gs-field">
        <label for="in-3"><span class="gs-tag">~S₁</span> bottom left</label>
        <input id="in-3" type="text" value="Non-life" autocomplete="off" spellcheck="false" />
      </div>
      <div class="gs-field">
        <label for="in-4"><span class="gs-tag">~S₂</span> bottom right</label>
        <input id="in-4" type="text" value="Non-death" autocomplete="off" spellcheck="false" />
      </div>
    </div>
  </div>

  <!-- ===== Editor: Relations ===== -->
  <div class="gs-section">
    <h2 class="gs-section-title">Relations</h2>
    <div class="gs-controls">
      <div class="gs-field">
        <label for="in-5">Top edge &middot; contrary</label>
        <input id="in-5" type="text" value="Contrary" autocomplete="off" spellcheck="false" />
      </div>
      <div class="gs-field">
        <label for="in-6">Bottom edge &middot; subcontrary</label>
        <input id="in-6" type="text" value="Subcontrary" autocomplete="off" spellcheck="false" />
      </div>
      <div class="gs-field">
        <label for="in-7">Left diagonal &middot; contradiction</label>
        <input id="in-7" type="text" value="Contradiction" autocomplete="off" spellcheck="false" />
      </div>
      <div class="gs-field">
        <label for="in-8">Right diagonal &middot; contradiction</label>
        <input id="in-8" type="text" value="Contradiction" autocomplete="off" spellcheck="false" />
      </div>
    </div>
  </div>

  <div class="gs-actions">
    <button type="button" id="gs-update">Update square</button>
    <button type="button" id="gs-reset" class="gs-secondary">Reset</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* Defaults */
  var TERM_DEFAULTS = ["Life", "Death", "Non-life", "Non-death"];
  var REL_DEFAULTS  = ["Contrary", "Subcontrary", "Contradiction", "Contradiction"];

  /* Collect DOM references */
  function byId(id) { return document.getElementById(id); }

  var termInputs = [1, 2, 3, 4].map(function (n) { return byId("in-" + n); });
  var relInputs  = [5, 6, 7, 8].map(function (n) { return byId("in-" + n); });

  var termBoxes  = [1, 2, 3, 4].map(function (n) { return byId("term-" + n); });
  var relBoxes   = [1, 2, 3, 4].map(function (n) { return byId("rel-"  + n); });

  var termMains  = [1, 2, 3, 4].map(function (n) { return byId("term-" + n + "-main"); });
  var relMains   = [1, 2, 3, 4].map(function (n) { return byId("rel-"  + n + "-main"); });

  /* Restart a CSS animation by forcing a reflow */
  function pulse(el) {
    el.classList.remove("gs-pulse");
    void el.offsetWidth;
    el.classList.add("gs-pulse");
  }

  /* Write a value into a main line, using an em dash when empty */
  function setMain(el, value) {
    if (value) {
      el.textContent = value;
      el.classList.remove("is-empty");
    } else {
      el.textContent = "\u2014";   /* em dash */
      el.classList.add("is-empty");
    }
  }

  function render(animate) {
    var i;

    for (i = 0; i < 4; i++) {
      setMain(termMains[i], termInputs[i].value.trim());
      if (animate) pulse(termBoxes[i]);
    }
    for (i = 0; i < 4; i++) {
      setMain(relMains[i], relInputs[i].value.trim());
      if (animate) pulse(relBoxes[i]);
    }
  }

  /* Update button */
  byId("gs-update").addEventListener("click", function () {
    render(true);
  });

  /* Reset button */
  byId("gs-reset").addEventListener("click", function () {
    var i;
    for (i = 0; i < 4; i++) {
      termInputs[i].value = TERM_DEFAULTS[i];
      relInputs[i].value  = REL_DEFAULTS[i];
    }
    render(true);
  });

  /* Enter key inside any field updates the square */
  termInputs.concat(relInputs).forEach(function (input) {
    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        render(true);
      }
    });
  });

  /* First paint, no animation */
  render(false);
})();
</script>

</body>
</html>
