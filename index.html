<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Greimas Square</title>
<style>
  /* ---------- Theme tokens (adapts to Obsidian, falls back to light/dark) ---------- */
  :root {
    --gs-bg:        var(--background-primary, #ffffff);
    --gs-panel:     var(--background-secondary, #f4f5f7);
    --gs-text:      var(--text-normal, #1f2328);
    --gs-muted:     var(--text-muted, #6b7280);
    --gs-border:    var(--background-modifier-border, #dcdfe4);
    --gs-accent:    var(--interactive-accent, #6c5ce7);
    --gs-accent-fg: var(--text-on-accent, #ffffff);
    --gs-line:      var(--text-faint, #9aa3b2);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --gs-bg:     var(--background-primary, #1e1e22);
      --gs-panel:  var(--background-secondary, #26262c);
      --gs-text:   var(--text-normal, #e7e7ea);
      --gs-muted:  var(--text-muted, #9aa0aa);
      --gs-border: var(--background-modifier-border, #3b3b44);
      --gs-accent: var(--interactive-accent, #8b7bff);
      --gs-line:   var(--text-faint, #79808f);
    }
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--gs-bg);
    color: var(--gs-text);
    font-family: var(--font-interface, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, "Helvetica Neue", Arial, sans-serif);
    font-size: 15px;
    line-height: 1.45;
    padding: 22px 16px 30px;
    display: flex;
    justify-content: center;
    -webkit-text-size-adjust: 100%;
  }

  .gs-app { width: 100%; max-width: 620px; }

  /* ---------- Header ---------- */
  .gs-app header { text-align: center; margin: 0 0 16px; }
  .gs-app header h1 {
    margin: 0 0 4px;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .gs-app header p {
    margin: 0;
    font-size: .8rem;
    color: var(--gs-muted);
  }

  /* ---------- The square ---------- */
  .gs-square {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--gs-bg);
    margin: 0 auto;
  }

  .gs-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .gs-lines line {
    stroke: var(--gs-line);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
    stroke-linecap: round;
  }
  .gs-lines line.gs-diag {
    stroke-dasharray: 6 6;
    opacity: .7;
  }

  /* ---------- Terms ---------- */
  .gs-term {
    position: absolute;
    transform: translate(-50%, -50%);
    max-width: 32%;
    padding: 5px 10px;
    border-radius: 8px;
    background: var(--gs-bg);
    text-align: center;
    font-weight: 600;
    font-size: 1rem;
    line-height: 1.25;
    overflow-wrap: anywhere;
    word-break: break-word;
    z-index: 2;
  }
  .gs-term.is-placeholder {
    color: var(--gs-muted);
    font-weight: 500;
  }

  .gs-tl { left: 18%; top: 18%; }
  .gs-tr { left: 82%; top: 18%; }
  .gs-bl { left: 18%; top: 82%; }
  .gs-br { left: 82%; top: 82%; }

  @keyframes gs-pulse {
    from { transform: translate(-50%, -50%) scale(.93); opacity: .35; }
    to   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
  }
  .gs-term.gs-pulse { animation: gs-pulse .28s ease-out; }

  /* ---------- Relation captions ---------- */
  .gs-rel {
    position: absolute;
    transform: translate(-50%, -50%);
    padding: 1px 6px;
    border-radius: 6px;
    background: var(--gs-bg);
    color: var(--gs-muted);
    font-size: .58rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
    z-index: 1;
  }
  .gs-rel-top    { left: 50%; top: 18%; }
  .gs-rel-bottom { left: 50%; top: 82%; }
  .gs-rel-left   { left: 18%; top: 50%; }
  .gs-rel-right  { left: 82%; top: 50%; }

  /* ---------- Form ---------- */
  .gs-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 14px;
    margin-top: 20px;
  }
  .gs-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .gs-field label {
    font-size: .7rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--gs-muted);
  }
  .gs-field input {
    width: 100%;
    padding: 8px 10px;
    font: inherit;
    font-size: .9rem;
    color: var(--gs-text);
    background: var(--gs-panel);
    border: 1px solid var(--gs-border);
    border-radius: 8px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .gs-field input::placeholder { color: var(--gs-muted); opacity: .7; }
  .gs-field input:focus {
    border-color: var(--gs-accent);
    box-shadow: 0 0 0 3px rgba(124, 108, 231, .18);
  }

  /* ---------- Buttons ---------- */
  .gs-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }
  .gs-actions button {
    font: inherit;
    font-size: .88rem;
    font-weight: 600;
    padding: 9px 22px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--gs-accent);
    color: var(--gs-accent-fg);
    cursor: pointer;
    transition: filter .15s ease, transform .06s ease;
  }
  .gs-actions button:hover { filter: brightness(1.08); }
  .gs-actions button:active { transform: translateY(1px); }
  .gs-actions button.gs-secondary {
    background: transparent;
    color: var(--gs-muted);
    border-color: var(--gs-border);
  }
  .gs-actions button.gs-secondary:hover {
    filter: none;
    color: var(--gs-text);
    border-color: var(--gs-muted);
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 480px) {
    .gs-controls { grid-template-columns: 1fr; }
    .gs-term { font-size: .9rem; max-width: 34%; }
  }
  @media (max-width: 380px) {
    .gs-rel { display: none; }
  }
</style>
</head>
<body>

<div class="gs-app">
  <header>
    <h1>Greimas Square</h1>
    <p>Edit the four terms, then press <strong>Update square</strong>.</p>
  </header>

  <!-- ===== The square ===== -->
  <div class="gs-square">
    <svg class="gs-lines" viewBox="0 0 100 100" preserveAspectRatio="none"
         aria-hidden="true" focusable="false">
      <!-- outer square -->
      <line x1="18" y1="18" x2="82" y2="18"></line>
      <line x1="82" y1="18" x2="82" y2="82"></line>
      <line x1="18" y1="18" x2="18" y2="82"></line>
      <line x1="18" y1="82" x2="82" y2="82"></line>
      <!-- diagonals -->
      <line class="gs-diag" x1="18" y1="18" x2="82" y2="82"></line>
      <line class="gs-diag" x1="82" y1="18" x2="18" y2="82"></line>
    </svg>

    <div class="gs-term gs-tl" id="term-1">S₁</div>
    <div class="gs-term gs-tr" id="term-2">S₂</div>
    <div class="gs-term gs-bl" id="term-3">~S₁</div>
    <div class="gs-term gs-br" id="term-4">~S₂</div>

    <div class="gs-rel gs-rel-top">contrariety</div>
    <div class="gs-rel gs-rel-bottom">subcontrariety</div>
    <div class="gs-rel gs-rel-left">contradiction</div>
    <div class="gs-rel gs-rel-right">contradiction</div>
  </div>

  <!-- ===== Editor ===== -->
  <div class="gs-controls">
    <div class="gs-field">
      <label for="in-1">S₁ · top left</label>
      <input id="in-1" type="text" value="Life" autocomplete="off" spellcheck="false" />
    </div>
    <div class="gs-field">
      <label for="in-2">S₂ · top right</label>
      <input id="in-2" type="text" value="Death" autocomplete="off" spellcheck="false" />
    </div>
    <div class="gs-field">
      <label for="in-3">~S₁ · bottom left</label>
      <input id="in-3" type="text" value="Non-life" autocomplete="off" spellcheck="false" />
    </div>
    <div class="gs-field">
      <label for="in-4">~S₂ · bottom right</label>
      <input id="in-4" type="text" value="Non-death" autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <div class="gs-actions">
    <button type="button" id="gs-update">Update square</button>
    <button type="button" id="gs-reset" class="gs-secondary">Reset</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var DEFAULTS     = ["Life", "Death", "Non-life", "Non-death"];
  var PLACEHOLDERS = ["S₁", "S₂", "~S₁", "~S₂"];

  var inputs = [0, 1, 2, 3].map(function (i) {
    return document.getElementById("in-" + (i + 1));
  });
  var terms = [0, 1, 2, 3].map(function (i) {
    return document.getElementById("term-" + (i + 1));
  });

  function render(animate) {
    for (var i = 0; i < 4; i++) {
      var value = inputs[i].value.trim();
      var el = terms[i];

      if (value) {
        el.textContent = value;
        el.classList.remove("is-placeholder");
      } else {
        el.textContent = PLACEHOLDERS[i];
        el.classList.add("is-placeholder");
      }

      if (animate) {
        el.classList.remove("gs-pulse");
        void el.offsetWidth;          /* restart the animation */
        el.classList.add("gs-pulse");
      }
    }
  }

  document.getElementById("gs-update").addEventListener("click", function () {
    render(true);
  });

  document.getElementById("gs-reset").addEventListener("click", function () {
    for (var i = 0; i < 4; i++) { inputs[i].value = DEFAULTS[i]; }
    render(true);
  });

  /* Pressing Enter inside any field also updates the square. */
  inputs.forEach(function (input) {
    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        render(true);
      }
    });
  });

  /* Initial paint (no animation). */
  render(false);
})();
</script>

</body>
</html>
