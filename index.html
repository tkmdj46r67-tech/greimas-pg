<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Greimas Square</title>
<style>
  /* ---------- Theme tokens (adapts to Obsidian, falls back to light/dark) ---------- */
  :root {
    --gs-bg:        var(--background-primary, #ffffff);
    --gs-panel:     var(--background-secondary, #f4f5f7);
    --gs-text:      var(--text-normal, #1f2328);
    --gs-muted:     var(--text-muted, #6b7280);
    --gs-border:    var(--background-modifier-border, #dcdfe4);
    --gs-accent:    var(--interactive-accent, #6c5ce7);
    --gs-accent-fg: var(--text-on-accent, #ffffff);
    --gs-line:      var(--text-faint, #9aa3b2);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --gs-bg:     var(--background-primary, #1e1e22);
      --gs-panel:  var(--background-secondary, #26262c);
      --gs-text:   var(--text-normal, #e7e7ea);
      --gs-muted:  var(--text-muted, #9aa0aa);
      --gs-border: var(--background-modifier-border, #3b3b44);
      --gs-accent: var(--interactive-accent, #8b7bff);
      --gs-line:   var(--text-faint, #79808f);
    }
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--gs-bg);
    color: var(--gs-text);
    font-family: var(--font-interface, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, "Helvetica Neue", Arial, sans-serif);
    font-size: 15px;
    line-height: 1.45;
    padding: 22px 16px 34px;
    display: flex;
    justify-content: center;
    -webkit-text-size-adjust: 100%;
  }

  .gs-app { width: 100%; max-width: 660px; }

  /* ---------- Header ---------- */
  header { text-align: center; margin: 0 0 18px; }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: .01em;
  }
  header p {
    margin: 0;
    font-size: .8rem;
    color: var(--gs-muted);
  }

  /* ---------- Stage (square canvas) ---------- */
  .gs-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }

  /* ---------- SVG lines ---------- */
  .gs-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }
  .gs-lines line {
    stroke: var(--gs-line);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
    stroke-linecap: round;
  }
  /* inner diagonals (implications) — dashed */
  .gs-lines line.gs-diag {
    stroke-dasharray: 6 6;
    opacity: .7;
  }
  /* outer metaterm diamond — dotted */
  .gs-lines line.gs-diamond {
    stroke-dasharray: 1 6;
    stroke-linecap: round;
    opacity: .85;
  }

  /* ---------- Shared node styling ---------- */
  .gs-term,
  .gs-meta,
  .gs-rel {
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 8px;
    background: var(--gs-bg);
    text-align: center;
    line-height: 1.18;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .gs-term,
  .gs-meta {
    padding: 5px 8px;
    z-index: 2;
  }
  .gs-term { max-width: 18%; }
  .gs-meta { max-width: 16%; }

  .gs-rel {
    padding: 3px 6px;
    max-width: 16%;
    z-index: 1;
    pointer-events: none;
  }

  /* Main line + traditional label */
  .gs-term-main,
  .gs-meta-main {
    font-size: 1rem;
    font-weight: 600;
    color: var(--gs-text);
    min-height: 1.18em;
  }
  .gs-rel-main {
    font-size: .72rem;
    font-weight: 600;
    color: var(--gs-text);
    min-height: 1.18em;
  }

  .gs-term-main.is-empty,
  .gs-meta-main.is-empty,
  .gs-rel-main.is-empty {
    color: var(--gs-muted);
    font-weight: 400;
  }

  .gs-term-label,
  .gs-meta-label {
    margin-top: 3px;
    font-size: .62rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--gs-muted);
  }
  .gs-rel-label {
    margin-top: 2px;
    font-size: .55rem;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--gs-muted);
  }

  /* ---------- Positions ---------- */
  /* Main terms — corners of inner square (31..69) */
  .gs-tl { left: 31%; top: 31%; }
  .gs-tr { left: 69%; top: 31%; }
  .gs-bl { left: 31%; top: 69%; }
  .gs-br { left: 69%; top: 69%; }

  /* Metaterms — vertices of outer dotted diamond */
  .gs-m1 { left: 50%; top: 8%; }
  .gs-m2 { left: 92%; top: 50%; }
  .gs-m3 { left: 50%; top: 92%; }
  .gs-m4 { left: 8%;  top: 50%; }

  /* Relations — midpoints of the inner square's edges */
  .gs-rel-top    { left: 50%; top: 31%; }
  .gs-rel-bottom { left: 50%; top: 69%; }
  .gs-rel-left   { left: 31%; top: 50%; }
  .gs-rel-right  { left: 69%; top: 50%; }

  /* ---------- Pulse animation on update ---------- */
  @keyframes gs-pulse {
    from { transform: translate(-50%, -50%) scale(.92); opacity: .35; }
    to   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
  }
  .gs-pulse { animation: gs-pulse .28s ease-out; }

  /* ---------- Form ---------- */
  .gs-section { margin-top: 24px; }
  .gs-section-title {
    margin: 0 0 10px;
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gs-muted);
  }
  .gs-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 14px;
  }
  .gs-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .gs-field label {
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--gs-muted);
  }
  .gs-field label .gs-tag {
    font-weight: 700;
    color: var(--gs-text);
    margin-right: 4px;
  }
  .gs-field input {
    width: 100%;
    padding: 8px 10px;
    font: inherit;
    font-size: .9rem;
    color: var(--gs-text);
    background: var(--gs-panel);
    border: 1px solid var(--gs-border);
    border-radius: 8px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .gs-field input::placeholder { color: var(--gs-muted); opacity: .7; }
  .gs-field input:focus {
    border-color: var(--gs-accent);
    box-shadow: 0 0 0 3px rgba(124, 108, 231, .18);
  }
